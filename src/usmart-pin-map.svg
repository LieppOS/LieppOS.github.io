<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="usmartMapTitle usmartMapDesc">
  <title id="usmartMapTitle">How the uSmart pins connect</title>
  <desc id="usmartMapDesc">A hand-drawn wiring sketch. Pin 1 is 5V through a switch controlled by GPIO152. Pin 2 is ground. Pins 3 and 4 are the USB2 D+ and D- pair through a switch or mux controlled by GPIO55. Pin 5 is ID into GPIO28. Pin 6 ties to pin 5 and goes to ground through a 5.1 kOhm resistor.</desc>

  <style>
    .paper { fill: #fbf7ea; }
    .ink { fill: #1f2a36; }
    .muted { fill: #5f6a76; }
    .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; }
    .hand { font-family: "Comic Sans MS", "Segoe Print", "DejaVu Sans", sans-serif; }
    .title { font-family: "Comic Sans MS", "Segoe Print", "DejaVu Sans", sans-serif; font-size: 24px; font-weight: 700; fill: #1f2a36; }
    .subtitle { font-family: "Comic Sans MS", "Segoe Print", "DejaVu Sans", sans-serif; font-size: 12px; fill: #5f6a76; }
    .label { font-size: 13.5px; font-weight: 650; fill: #1f2a36; }
    .small { font-size: 10px; fill: #5f6a76; }
    .note { font-family: "Comic Sans MS", "Segoe Print", "DejaVu Sans", sans-serif; font-size: 10.5px; fill: #5f6a76; font-style: italic; }
    .note-red { fill: #9a3412; }
    .note-blue { fill: #1f5f8b; }
    .note-green { fill: #2f6b3f; }
    .box { fill: #fffdf7; stroke: #26323e; stroke-width: 1.6; }
    .power-box { fill: #fffaf2; stroke: #b45309; stroke-width: 1.6; }
    .data-box { fill: #f6fbff; stroke: #1f5f8b; stroke-width: 1.6; }
    .detect-box { fill: #f7fbf5; stroke: #2f6b3f; stroke-width: 1.6; }
    .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .power { stroke: #b45309; stroke-width: 2.15; }
    .data { stroke: #1f5f8b; stroke-width: 2.15; }
    .detect { stroke: #2f6b3f; stroke-width: 2.15; }
    .ground { stroke: #4b5563; stroke-width: 2.15; }
    .control { stroke: #7c5a2a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .type-c { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .pin-dot { stroke-width: 1.5; }
    .pin-num { font-size: 10px; font-weight: 700; }
  </style>

  <defs>
    <pattern id="dotGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.65" fill="#d8cfba"/>
    </pattern>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#1f5f8b" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#2f6b3f" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrowGrey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="900" height="700" class="paper"/>
  <rect width="900" height="700" fill="url(#dotGrid)" opacity="0.45"/>
  <rect x="8" y="8" width="884" height="684" rx="8" fill="none" stroke="#d8cfba" stroke-width="1"/>
  <line x1="27" y1="92" x2="27" y2="670" stroke="#e3b5a8" stroke-width="1.2"/>

  <text x="40" y="43" class="title">uSmart connector — internal wiring</text>
  <text x="40" y="66" class="subtitle">Working pinout · pin 1 at the top · 2026-10-25</text>
  <path d="M40 52 C 120 55, 230 49, 378 53" fill="none" stroke="#2f6b3f" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <text x="690" y="42" class="hand" font-size="12" fill="#2f6b3f" font-weight="700">working pinout ✓</text>
  <text x="690" y="60" class="small">6 pins · USB 2.0</text>

  <!-- Connector -->
  <text x="40" y="110" class="hand" font-size="15" font-weight="700" fill="#1f2a36">uSmart connector</text>
  <text x="40" y="126" class="small">pin 1 nearest the top of the phone</text>
  <rect x="40" y="140" width="150" height="490" rx="6" class="box"/>
  <rect x="42.5" y="142.5" width="150" height="490" rx="6" fill="none" stroke="#26323e" stroke-width="1" opacity="0.18"/>

  <!-- Pin 1 -->
  <circle cx="68" cy="190" r="12" fill="#fffdf7" stroke="#b45309" stroke-width="1.5"/>
  <text x="68" y="194" text-anchor="middle" class="mono pin-num" fill="#b45309">1</text>
  <text x="89" y="186" class="label">5V</text>
  <text x="89" y="201" class="small">power out</text>
  <circle cx="190" cy="190" r="4.5" fill="#b45309" class="pin-dot" stroke="#b45309"/>

  <!-- Pin 2 -->
  <circle cx="68" cy="255" r="12" fill="#fffdf7" stroke="#4b5563" stroke-width="1.5"/>
  <text x="68" y="259" text-anchor="middle" class="mono pin-num" fill="#4b5563">2</text>
  <text x="89" y="251" class="label">GND</text>
  <text x="89" y="266" class="small">return</text>
  <circle cx="190" cy="255" r="4.5" fill="#4b5563" class="pin-dot" stroke="#4b5563"/>

  <!-- Pin 3 -->
  <circle cx="68" cy="320" r="12" fill="#fffdf7" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="68" y="324" text-anchor="middle" class="mono pin-num" fill="#1f5f8b">3</text>
  <text x="89" y="316" class="label">D+</text>
  <text x="89" y="331" class="small">USB data</text>
  <circle cx="190" cy="320" r="4.5" fill="#1f5f8b" class="pin-dot" stroke="#1f5f8b"/>

  <!-- Pin 4 -->
  <circle cx="68" cy="385" r="12" fill="#fffdf7" stroke="#1f5f8b" stroke-width="1.5"/>
  <text x="68" y="389" text-anchor="middle" class="mono pin-num" fill="#1f5f8b">4</text>
  <text x="89" y="381" class="label">D−</text>
  <text x="89" y="396" class="small">USB data</text>
  <circle cx="190" cy="385" r="4.5" fill="#1f5f8b" class="pin-dot" stroke="#1f5f8b"/>

  <!-- Pin 5 -->
  <circle cx="68" cy="450" r="12" fill="#fffdf7" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="68" y="454" text-anchor="middle" class="mono pin-num" fill="#2f6b3f">5</text>
  <text x="89" y="446" class="label">ID</text>
  <text x="89" y="461" class="small">detect</text>
  <circle cx="190" cy="450" r="4.5" fill="#2f6b3f" class="pin-dot" stroke="#2f6b3f"/>

  <!-- Pin 6 -->
  <circle cx="68" cy="515" r="12" fill="#fffdf7" stroke="#2f6b3f" stroke-width="1.5"/>
  <text x="68" y="519" text-anchor="middle" class="mono pin-num" fill="#2f6b3f">6</text>
  <text x="89" y="511" class="label">OTG</text>
  <text x="89" y="526" class="small">tied to pin 5</text>
  <circle cx="190" cy="515" r="4.5" fill="#2f6b3f" class="pin-dot" stroke="#2f6b3f"/>

  <!-- 5V path -->
  <rect x="300" y="150" width="180" height="80" rx="5" class="power-box"/>
  <text x="315" y="177" class="hand" font-size="14" font-weight="700" fill="#9a3412">5V switch</text>
  <text x="315" y="197" class="mono" font-size="11" fill="#9a3412">GPIO152 HIGH = on</text>
  <text x="315" y="215" class="note note-red">current limit not published</text>

  <rect x="650" y="150" width="210" height="80" rx="5" class="box"/>
  <text x="665" y="177" class="hand" font-size="14" font-weight="700">phone 5V</text>
  <text x="665" y="197" class="small">supply for the accessory</text>
  <text x="665" y="215" class="small">switched by GPIO152</text>

  <path d="M650 190 H480" class="line power" marker-end="url(#arrowRed)"/>
  <path d="M300 190 H194" class="line power" marker-end="url(#arrowRed)"/>
  <text x="218" y="180" class="note note-red">5V out</text>

  <!-- GND -->
  <path d="M195 255 H245" class="line ground"/>
  <path d="M245 255 V266" class="line ground"/>
  <path d="M232 266 H258" class="line ground"/>
  <path d="M237 272 H253" class="line ground"/>
  <path d="M241 278 H249" class="line ground"/>
  <text x="267" y="250" class="note">GND</text>
  <text x="267" y="264" class="small">return</text>

  <!-- USB data -->
  <path d="M195 320 H250 V355 H300" class="line data"/>
  <path d="M195 385 H250 V355" class="line data"/>
  <circle cx="250" cy="355" r="3.5" fill="#f6fbff" stroke="#1f5f8b" stroke-width="1.6"/>
  <text x="207" y="310" class="note note-blue">D+ / D−</text>

  <rect x="300" y="295" width="190" height="120" rx="5" class="data-box"/>
  <text x="315" y="323" class="hand" font-size="14" font-weight="700" fill="#1f5f8b">USB2 route</text>
  <text x="315" y="344" class="mono" font-size="11" fill="#1f5f8b">GPIO55 HIGH = uSmart</text>
  <text x="315" y="365" class="note note-blue">one pair at a time</text>
  <text x="315" y="384" class="small">uSmart or Type-C</text>
  <text x="315" y="402" class="small">board part unknown</text>

  <rect x="520" y="235" width="160" height="45" rx="5" fill="#f8fafc" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="535" y="253" class="small" fill="#4b5563">Type-C D+/D−</text>
  <text x="535" y="268" class="small" fill="#6b7280">when uSmart is off</text>
  <path d="M520 257 H470 V295" class="line type-c" marker-end="url(#arrowGrey)"/>

  <!-- USB chain -->
  <text x="550" y="298" class="note note-blue">normal USB 2.0 host</text>
  <rect x="550" y="315" width="90" height="80" rx="5" class="box"/>
  <text x="595" y="345" text-anchor="middle" class="mono" font-size="11.5" fill="#1f2a36">USB2 PHY</text>
  <text x="595" y="363" text-anchor="middle" class="small">phy0</text>

  <rect x="660" y="315" width="80" height="80" rx="5" class="box"/>
  <text x="700" y="345" text-anchor="middle" class="mono" font-size="11.5" fill="#1f2a36">MTU3</text>
  <text x="700" y="363" text-anchor="middle" class="small">11201000</text>

  <rect x="760" y="315" width="100" height="80" rx="5" class="box"/>
  <text x="810" y="345" text-anchor="middle" class="mono" font-size="11.5" fill="#1f2a36">xHCI</text>
  <text x="810" y="363" text-anchor="middle" class="small">USB host</text>

  <path d="M490 355 H550" class="line data"/>
  <path d="M640 355 H660" class="line data" marker-end="url(#arrowBlue)"/>
  <path d="M740 355 H760" class="line data" marker-end="url(#arrowBlue)"/>
  <text x="550" y="410" class="note">USB 2.0 only · no separate controller</text>

  <!-- Detect -->
  <path d="M195 450 H300" class="line detect" marker-end="url(#arrowGreen)"/>
  <text x="207" y="440" class="note note-green">ID</text>

  <rect x="300" y="425" width="190" height="80" rx="5" class="detect-box"/>
  <text x="315" y="452" class="hand" font-size="14" font-weight="700" fill="#2f6b3f">detect input</text>
  <text x="315" y="472" class="mono" font-size="11" fill="#2f6b3f">GPIO28</text>
  <text x="315" y="490" class="note note-green">LOW = inserted · no model ID</text>

  <!-- Pin 6 tie and resistor -->
  <path d="M195 515 H250" class="line detect"/>
  <path d="M250 450 V515" class="line detect"/>
  <circle cx="250" cy="450" r="3.5" fill="#f7fbf5" stroke="#2f6b3f" stroke-width="1.6"/>
  <path d="M250 515 V552" class="line detect"/>
  <rect x="239" y="552" width="22" height="34" rx="2" fill="#fffdf7" stroke="#2f6b3f" stroke-width="1.5"/>
  <path d="M250 586 V602" class="line detect"/>
  <path d="M250 602 V612" class="line ground"/>
  <path d="M237 612 H263" class="line ground"/>
  <path d="M242 618 H258" class="line ground"/>
  <path d="M246 624 H254" class="line ground"/>
  <text x="270" y="570" class="note note-green">5.1 kΩ</text>
  <text x="270" y="584" class="small">tested, works</text>
  <text x="270" y="598" class="small">to GND</text>
  <text x="285" y="540" class="note">pins 5 + 6 tied</text>
  <text x="500" y="555" class="note note-green">pin 6 has no GPIO of its own</text>

  <!-- Summary note -->
  <text x="550" y="500" class="hand" font-size="12" fill="#2f6b3f">ID low → 5V on → data route → HOST</text>
  <text x="550" y="520" class="small">The phone becomes the USB host after the ID pin goes low.</text>

  <!-- Footer -->
  <text x="40" y="660" class="small">GPIO = a control pin on the phone's processor.</text>
  <text x="300" y="660" class="small">Diagram is not to scale.</text>
  <text x="730" y="660" class="small">working pinout · 2026-10-25</text>
</svg>
