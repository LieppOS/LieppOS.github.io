
name: Deploy LieppOS Wiki

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: cargo install --locked mdbook --version 0.5.4

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Build website
        run: mdbook build

      - name: Detect HTML output
        id: site
        shell: bash
        run: |
          if [ -f book/index.html ]; then
            echo "path=book" >> "$GITHUB_OUTPUT"
          elif [ -f book/html/index.html ]; then
            echo "path=book/html" >> "$GITHUB_OUTPUT"
          else
            echo "Missing index.html"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}

      - id: deployment
        uses: actions/deploy-pages@v4

